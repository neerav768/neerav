<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Portfolio Manager</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #081120, #111827 55%, #0f172a);
        color: #e5eefc;
      }
      .container {
        max-width: 980px;
        margin: 40px auto;
        padding: 28px;
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        box-shadow: 0 18px 48px rgba(0,0,0,0.35);
      }
      h1 {
        margin: 0 0 24px;
        text-align: center;
        color: #7dd3fc;
        font-size: 2rem;
      }
      .top-box {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 24px;
      }
      .form-box, .summary-box, .list-box {
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 20px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .field.full {
        grid-column: 1 / -1;
      }
      label {
        font-size: 0.9rem;
        color: #cfe3ff;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(125, 211, 252, 0.25);
        border-radius: 10px;
        background: #0f172a;
        color: white;
        font-size: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #7dd3fc;
        box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.2);
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }
      .primary {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
      }
      .secondary {
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
        color: white;
      }
      .danger {
        background: linear-gradient(135deg, #f97316, #dc2626);
        color: white;
      }
      button:hover { opacity: 0.95; transform: translateY(-1px); }
      .summary-box h3, .list-box h3 {
        margin: 0 0 16px;
        color: #a7f3d0;
      }
      .big-total {
        font-size: 2rem;
        font-weight: bold;
        color: #34d399;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th, td {
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        text-align: left;
      }
      th {
        color: #bfdbfe;
        font-size: 0.82rem;
        text-transform: uppercase;
      }
      .hidden-file {
        display: none;
      }
      .small-note {
        margin-top: 12px;
        font-size: 0.82rem;
        color: #bfdbfe;
      }
      @media (max-width: 760px) {
        .top-box, .form-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Stock Portfolio Manager</h1>

      <div class="top-box">
        <div class="form-box">
          <div class="form-grid">
            <div class="field full">
              <label for="company">Company Name</label>
              <input id="company" type="text" placeholder="e.g. Reliance Industries" />
            </div>

            <div class="field">
              <label for="price">Price</label>
              <input id="price" type="number" step="0.01" placeholder="Enter price" />
            </div>

            <div class="field">
              <label for="qty">Quantity</label>
              <input id="qty" type="number" min="1" placeholder="Enter quantity" />
            </div>

            <div class="field full">
              <label for="total">Total Value</label>
              <input id="total" type="text" placeholder="Calculated automatically" readonly />
            </div>
          </div>

          <div class="actions">
            <button class="primary" id="addBtn">Add Entry</button>
            <button class="secondary" id="downloadBtn">Download Excel</button>
            <button class="danger" id="importBtn">Upload Excel</button>
          </div>

          <input class="hidden-file" type="file" id="excelFile" accept=".csv,.xls,.xlsx" />
          <div class="small-note">Download creates an Excel-friendly CSV file. Upload supports CSV files from Excel.</div>
        </div>

        <div class="summary-box">
          <h3>Portfolio Summary</h3>
          <div class="big-total" id="grandTotal">₹0.00</div>
          <div class="small-note" id="entryCount">0 entries</div>
        </div>
      </div>

      <div class="list-box">
        <h3>Saved Stock List</h3>
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="stockTableBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'stockPortfolioList';
      const company = document.getElementById('company');
      const price = document.getElementById('price');
      const qty = document.getElementById('qty');
      const total = document.getElementById('total');
      const grandTotal = document.getElementById('grandTotal');
      const entryCount = document.getElementById('entryCount');
      const stockTableBody = document.getElementById('stockTableBody');
      const excelFile = document.getElementById('excelFile');

      let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      function formatMoney(value) {
        return `₹${Number(value).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      }

      function updateTotalPreview() {
        const priceValue = parseFloat(price.value) || 0;
        const qtyValue = parseFloat(qty.value) || 0;
        const totalValue = priceValue * qtyValue;

        total.value = formatMoney(totalValue);
      }

      function saveEntries() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }

      function renderTable() {
        stockTableBody.innerHTML = '';
        let totalPortfolio = 0;

        entries.forEach((item, index) => {
          totalPortfolio += item.total;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.company}</td>
            <td>${formatMoney(item.price)}</td>
            <td>${item.quantity}</td>
            <td>${formatMoney(item.total)}</td>
          `;
          stockTableBody.appendChild(row);
        });

        grandTotal.textContent = formatMoney(totalPortfolio);
        entryCount.textContent = `${entries.length} entr${entries.length === 1 ? 'y' : 'ies'}`;
      }

      function addEntry() {
        const companyName = company.value.trim();
        const priceValue = parseFloat(price.value);
        const qtyValue = parseFloat(qty.value);

        if (!companyName || !Number.isFinite(priceValue) || !Number.isFinite(qtyValue) || qtyValue <= 0) {
          alert('Please enter a valid company name, price, and quantity.');
          return;
        }

        const item = {
          company: companyName,
          price: priceValue,
          quantity: qtyValue,
          total: priceValue * qtyValue
        };

        entries.push(item);
        saveEntries();
        renderTable();

        company.value = '';
        price.value = '';
        qty.value = '';
        total.value = '';
      }

      function toCSV() {
        const rows = [
          ['Company', 'Price', 'Quantity', 'Total'],
          ...entries.map(item => [item.company, item.price, item.quantity, item.total])
        ];

        const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(',')).join('\n');
        return csv;
      }

      function downloadExcel() {
        if (entries.length === 0) {
          alert('No stock entries to export.');
          return;
        }

        const csvContent = toCSV();
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);

        link.href = url;
        link.download = 'stock_portfolio.csv';
        link.click();
        URL.revokeObjectURL(url);
      }

      function parseCSV(csvText) {
        const lines = csvText.trim().split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) return [];

        const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());
        const companyIndex = headers.indexOf('company');
        const priceIndex = headers.indexOf('price');
        const qtyIndex = headers.indexOf('quantity');

        if (companyIndex === -1 || priceIndex === -1 || qtyIndex === -1) {
          throw new Error('CSV must include Company, Price, and Quantity columns.');
        }

        const imported = [];

        for (let i = 1; i < lines.length; i++) {
          const row = parseCSVLine(lines[i]);
          const companyName = row[companyIndex]?.replace(/^"|"$/g, '').trim();
          const priceValue = parseFloat(row[priceIndex]);
          const qtyValue = parseFloat(row[qtyIndex]);

          if (!companyName || !Number.isFinite(priceValue) || !Number.isFinite(qtyValue) || qtyValue <= 0) {
            continue;
          }

          imported.push({
            company: companyName,
            price: priceValue,
            quantity: qtyValue,
            total: priceValue * qtyValue
          });
        }

        return imported;
      }

      function parseCSVLine(line) {
        const cells = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            cells.push(current);
            current = '';
          } else {
            current += char;
          }
        }

        cells.push(current);
        return cells;
      }

      function uploadExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function () {
          try {
            const imported = parseCSV(reader.result);
            if (imported.length === 0) {
              alert('No valid stock rows were found in the uploaded file.');
              return;
            }

            entries = entries.concat(imported);
            saveEntries();
            renderTable();
            alert(`${imported.length} entries imported successfully.`);
          } catch (error) {
            alert('Could not read this file. Please upload a CSV file with Company, Price, and Quantity columns.');
          }
        };

        reader.readAsText(file);
        event.target.value = '';
      }

      document.getElementById('addBtn').addEventListener('click', addEntry);
      document.getElementById('downloadBtn').addEventListener('click', downloadExcel);
      document.getElementById('importBtn').addEventListener('click', () => excelFile.click());
      excelFile.addEventListener('change', uploadExcel);
      price.addEventListener('input', updateTotalPreview);
      qty.addEventListener('input', updateTotalPreview);

      renderTable();
      updateTotalPreview();
    </script>
  </body>
</html>
